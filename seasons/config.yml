  forest: forest
  taiga: taiga
  swamp: swamp
  jungle: jungle
  savanna: savanna
  desert: desert
  beach: beach
  ocean: warm_ocean
  river: river
  cherry_grove: forest
  snowy_taiga: taiga
  snowy_plains: plains
  snowy_beach: beach
  snowy_slopes: meadow
  frozen_ocean: ocean
  frozen_river: river
  frozen_peaks: jagged_peaks
  ice_spikes: snowy_plains
  jagged_peaks: jagged_peaks

# Осень: тусклее и суше; снежными становятся тайга и горы/предгорья.
# Пики и ледники (jagged_peaks, frozen_peaks, snowy_slopes, ice_spikes) осенью
# остаются снежными как есть — их в таблице нет.
