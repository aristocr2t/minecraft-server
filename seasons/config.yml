# Сезонные биомы: карта исходных биомов и сезонные преобразования по ней.
# Таблицы «исходный биом карты → биом сезона»: spring-map, summer-map, autumn-map, winter-map.
# Ключ — то, что лежит в базе (original_biome), значение — что поставить в этот сезон.
# Биом, которого нет в таблицах, не меняется никогда. Имена — без префикса minecraft:.
# Опечатки при старте пишутся в лог и пропускаются.

# Случайные тики по сезонам: таяние снега и льда, рост культур.
# Зима 0 — снег и лёд копятся (осадки от этого параметра не зависят), лето 10 — тает быстро.
random-tick-speed:
  spring: 3
  summer: 10
  autumn: 1
  winter: 1

# Порция работы за тик: чанков и миллисекунд.
chunks-per-tick: 16
max-millis-per-tick: 20
# Коммит в SQLite каждые N чанков.
commit-every-chunks: 32
# Строка прогресса сканирования каждые N чанков.
log-every-chunks: 200

# Полоса высот, которую заносим в карту (клетки 4×4×4 — точность самой игры).
min-y: 40
max-y: 320

# Сканирование при старте сервера: продолжает карту с того места, где остановилось.
# Список чанков берётся из region-файлов мира: отсутствующие чанки не генерируются,
# уже просканированные не читаются второй раз.
scan-on-enable: true
# Необязательное ограничение карты в блоках от центра мира (0 = вся карта).
scan-max-radius: 0

# ВЕСНА = возврат к original_biome (как и restore). Если хотите отдельную весну,
# раскомментируйте строки ниже — они переопределят возврат оригинала.
spring-map: {}
# spring-map:
#   plains: flower_forest
#   forest: birch_forest
#   taiga: birch_forest
#   swamp: mangrove_swamp
#   cherry_grove: cherry_grove

