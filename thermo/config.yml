# ============================================================
#  Thermo — температура тела и окружающей среды
# ============================================================

# Как часто пересчитывать температуру (тиков; 20 = 1 секунда).
interval-ticks: 20

# Показывать в боссбаре температуру ТЕЛА.
bossbar:
  enabled: true
  # {temp} подставляется как число с одним знаком (36.6).
  title: "температура {temp}°C"
  # Диапазон, который растягивается на 0..100% полоски.
  min: 30.0
  max: 43.0
  # notched_6 / notched_10 / notched_12 / notched_20 / progress
  style: notched_12

# База: нормальная температура тела.
body-base: 36.6

# Насколько сильно среда тянет тело за собой: delta = (env - 20) * body-factor
body-factor: 0.22

# Плавность: тело меняется не мгновенно, а дрейфует к цели.
# 0.05 °C/с — от нормы до обморожения около двух минут.
body-drift-per-second: 0.05

# Маяк: стоять рядом — тело быстро возвращается к норме.
beacon:
  # Радиус поиска маяка вокруг игрока (0 — выключить).
  radius: 8
  # Во сколько раз быстрее дрейф к норме рядом с маяком.
  multiplier: 6.0

# Отдых: сон и лежание на кровати тянут тело обратно к норме (36.6).
rest:
  # Во сколько раз быстрее дрейф во сне.
  sleep-multiplier: 4.0
  # Во сколько раз быстрее дрейф, если лежать на кровати (присесть на неё).
  bed-multiplier: 2.0

# ---------------------------- Среда -------------------------
environment:
  base: 20.0
  # Влияние биома по ключу (поиск подстроки в ключе биома).
  biomes:
    snowy: -15.0
    frozen: -15.0
    ice_spikes: -15.0
    taiga: -5.0
    grove: -8.0
    windswept: -6.0
    meadow: -2.0
    forest: 0.0
    plains: 2.0
    swamp: 3.0
    jungle: 8.0
    savanna: 10.0
    badlands: 12.0
    desert: 15.0
  # Выше этой высоты каждый шаг отнимает градусы.
  height-start: 100
  height-per: 30.0
  height-step: -1.0
  # Сезонные поправки.
  seasons:
    WINTER: -10.0
    SPRING: -3.0
    SUMMER: 10.0
    AUTUMN: 0.0
  weather:
    rain: -4.0
    thunder: -6.0
  # Вода.
  water: -8.0
  water-snowy: -12.0
  # Горячие блоки в радиусе (блоков) — бонус за каждый найденный тип.
  heat-radius: 4
  heat:
    LAVA: 15.0
    FIRE: 10.0
    SOUL_FIRE: 10.0
    MAGMA_BLOCK: 8.0
    CAMPFIRE: 12.0
    SOUL_CAMPFIRE: 10.0
    FURNACE: 4.0
    BLAST_FURNACE: 6.0
    SMOKER: 4.0
    LANTERN: 2.0
    SOUL_LANTERN: 2.0
    TORCH: 2.0
    WALL_TORCH: 2.0
    GLOWSTONE: 3.0
  # Измерения.
  dimensions:
    world_the_nether: 20.0
    world_the_end: -10.0

# ---------------------------- Одежда ------------------------
# Бонус за каждый предмет брони. Мокрый игрок получает половину бонуса.
clothing:
  LEATHER_HELMET: 1.0
  LEATHER_CHESTPLATE: 1.0
  LEATHER_LEGGINGS: 1.0
  LEATHER_BOOTS: 1.0
  CHAINMAIL_HELMET: 0.5
  CHAINMAIL_CHESTPLATE: 0.5
  CHAINMAIL_LEGGINGS: 0.5
  CHAINMAIL_BOOTS: 0.5
  IRON_HELMET: -0.5
  IRON_CHESTPLATE: -0.5
  IRON_LEGGINGS: -0.5
  IRON_BOOTS: -0.5
  GOLDEN_HELMET: -0.5
  GOLDEN_CHESTPLATE: -0.5
  GOLDEN_LEGGINGS: -0.5
  GOLDEN_BOOTS: -0.5
  # diamond/netherite не греют, но гасят погоду — см. weather-resist.
  DIAMOND_HELMET: 0.0
  DIAMOND_CHESTPLATE: 0.0
  DIAMOND_LEGGINGS: 0.0
  DIAMOND_BOOTS: 0.0
  NETHERITE_HELMET: 0.0
  NETHERITE_CHESTPLATE: 0.0
  NETHERITE_LEGGINGS: 0.0
  NETHERITE_BOOTS: 0.0

# Погода не действует на игрока в такой броне (доля гашения на предмет).
weather-resist:
  DIAMOND_HELMET: 0.25
  DIAMOND_CHESTPLATE: 0.25
  NETHERITE_HELMET: 0.25
  NETHERITE_CHESTPLATE: 0.25

# Прочие факторы тела.
factors:
  well-fed: 0.4          # сытость >= 18
  hungry: -0.6           # сытость <= 6
  sprinting: 1.0
  wet: -1.0

# ---------------------------- Состояния ---------------------
# Тело <= max попадает в состояние (первое сверху). Эффекты — как в Minecraft.
states:
  - id: freezing
    max: 31.0
    label: "обморожение"
    damage: 1.0
    damage-seconds: 30
    effects: [ { type: SLOWNESS, amplifier: 2 } ]
  - id: cold
    max: 34.0
    label: "холодно"
    damage: 1.0
    damage-seconds: 60
    effects: [ { type: SLOWNESS, amplifier: 1 } ]
  - id: cool
    max: 35.5
    label: "прохладно"
    effects: [ { type: SLOWNESS, amplifier: 0 } ]
  - id: normal
    max: 38.0
    label: "норма"
  - id: warm
    max: 40.0
    label: "тепло"
  - id: hot
    max: 42.0
    label: "жарко"
    damage: 1.0
    damage-seconds: 60
    effects: [ { type: SLOWNESS, amplifier: 0 }, { type: HUNGER, amplifier: 0 } ]
  - id: burning
    max: 99.0
    label: "перегрев"
    damage: 1.0
    damage-seconds: 30
    effects: [ { type: NAUSEA, amplifier: 0 } ]

# Цвет боссбара по состоянию тела.
colors:
  freezing: BLUE
  cold: PURPLE
  cool: WHITE
  normal: GREEN
  warm: YELLOW
  hot: RED
  burning: RED

# ---------------------------- Болезнь -----------------------
illness:
  enabled: true
  # Сколько секунд подряд вне «нормы» приводит к болезни.
  seconds-outside: 60
  duration: 15
  effects: [ { type: NAUSEA, amplifier: 0 }, { type: WEAKNESS, amplifier: 0 }, { type: HUNGER, amplifier: 0 } ]

# ---------------------------- Градусник ---------------------
thermometer:
  # Предмет градусника.
  material: CLOCK
  name: "Градусник"
  # custom-model-data для ресурспака (0 — не задавать).
  custom-model-data: 0
  glint: true
  # Показывать сводку в actionbar, когда градусник в руке.
  actionbar: true
  actionbar-interval-ticks: 40
  # Крафт (только если recipe-enabled: true).
  recipe-enabled: false
  recipe-shape: [ " G ", " C ", " R " ]
  recipe-ingredients:
    G: GLASS
    C: CLOCK
    R: REDSTONE

# ---------------------------- Сезоны ------------------------
seasons:
  # Часы сезона: сколько минут длится один сезон.
  duration-minutes: 1440
  # Стартовый сезон: WINTER / SPRING / SUMMER / AUTUMN.
  start: WINTER
  # Вызывать `/seasons <имя>` при смене сезона (плагин Seasons).
  call-seasons-plugin: true
  order: [ WINTER, SPRING, SUMMER, AUTUMN ]

# Сообщения игроку.
messages:
  prefix: ""
  env-line: "Среда: {env}°C ({env-state})"
  body-line: "Тело: {body}°C ({body-state})"
  clothes-line: "Одежда: {bonus}"
  reason-line: "Причина среды: {reason}"
  no-permission: "нет прав"
