name: Thermo
version: 1.0.0
main: ru.geekideas.mc.thermo.ThermoPlugin
api-version: '26.3'
authors: [aristocr2t]
description: Температура тела и окружающей среды, градусник, перегрев и переохлаждение, сезонные часы.
softdepend: [Seasons]
commands:
  thermo:
    description: Температура тела и среды
    usage: /thermo status|reload|season|set|thermometer
permissions:
  thermo.admin:
    description: Административные подкоманды Thermo
    default: op
